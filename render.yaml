services:
  - type: web
    name: precision-lab-readonly-api
    runtime: python
    plan: free
    buildCommand: pip install --upgrade pip && pip install -r requirements-dev.txt && pytest -q
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    autoDeployTrigger: "off"
    envVars:
      - key: GITHUB_READ_TOKEN
        sync: false
      - key: SERVICE_API_KEY
        sync: false
      - key: GITHUB_WRITE_TOKEN
        sync: false
      - key: PUBLIC_BASE_URL
        value: "https://precision-lab-readonly-api.onrender.com"
      - key: GITHUB_TIMEOUT_SECONDS
        value: "15"
