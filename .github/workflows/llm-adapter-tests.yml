name: LLM read-only adapter tests

on:
  pull_request:
    paths:
      - "integrations/**"
      - "tests/**"
      - "scripts/verify_live_api.py"
      - "requirements*.txt"
      - ".github/workflows/llm-adapter-tests.yml"
  push:
    branches:
      - main
      - "feat/multi-llm-readonly-adapters"
    paths:
      - "integrations/**"
      - "tests/**"
      - "scripts/verify_live_api.py"
      - "requirements*.txt"
      - ".github/workflows/llm-adapter-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: llm-adapter-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: Offline unit tests (no credentials, no live API)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install development dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run unit tests without network credentials
        env:
          SERVICE_API_KEY: ""
          GITHUB_READ_TOKEN: ""
        run: python -m pytest -q
